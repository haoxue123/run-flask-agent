services:
  web:
    # ⚠️ 关键修复：build context 必须是项目根目录（../），
    # 否则 Dockerfile 的 COPY . . 只会复制 deploy/ 内的文件（缺 app.py/routes/）。
    # dockerfile 仍用 deploy/Dockerfile（其 COPY 路径相对于 context）。
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SECRET_KEY=${SECRET_KEY}       # 生产必填：否则每次重启会话/教练记忆失效
      - FLASK_ENV=production
    volumes:
      # 全部有状态数据都在 data/ 一个目录（运动文件 + uploads + charts + chroma_db + knowledge）
      - ./data:/app/data
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro     # certbot 生成的证书
      - ./logs:/var/log/nginx
