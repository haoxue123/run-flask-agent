<body data-page="coach">

  <nav class="nav">
    <div class="brand">马拉松训练计划 Agent</div>

      <li><a href="index.html" data-page="index">数据总览</a></li>

<main>
  <div class="page-head">
    <h1>教练对话</h1>
    <p>和 AI 教练自然语言交流，获取训练建议。下方表单提交仅作视觉演示，不真实发送。</p>
  </div>

  <div class="card">
    <div class="filters" style="margin-bottom:.8rem;">
      <button class="filter quick-q">怎么安排本周训练？</button>
      <button class="filter quick-q">我配速上不去怎么办？</button>
      <button class="filter quick-q">下周要比赛怎么调整？</button>
      <button class="filter quick-q">我的恢复够吗？</button>
    </div>
    <div class="chat" id="chat"></div>
    <form class="chat-form" id="coachForm">
      <input id="coachInput" placeholder="输入你的问题，回车发送…" autocomplete="off">
      <button class="btn" type="submit">发送</button>
    </form>
  </div>

  <div class="card">
    <form class="feedback" id="feedbackForm">
      <h3>课程反馈</h3>
      <input name="name" placeholder="你的称呼" required>
      <select name="rate">
        <option>非常有帮助</option><option>有帮助</option><option>一般</option>
      </select>
      <textarea name="msg" placeholder="想对教练说的…"></textarea>
      <button class="btn" type="submit">提交反馈</button>
      <p class="ok" id="fbMsg" hidden>✓ 已收到你的反馈，谢谢！（演示，未真实提交）</p>
    </form>
  </div>
</main>

<footer>
  <div class="foot">

</footer>
